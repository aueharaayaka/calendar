<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カレンダー</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fdf6fb;
    --bg-grad-1: #fbeef6;
    --bg-grad-2: #eef3fb;
    --surface: #ffffff;
    --surface-soft: #fef9fd;
    --border: #f2e3ee;
    --border-soft: #f6ecf3;
    --text: #5b4a57;
    --text-soft: #9a8a96;
    --text-faint: #c4b6c0;
    --pink: #ffb6d9;
    --pink-soft: #ffe4f1;
    --mint: #b8ecd9;
    --mint-soft: #e3f7ef;
    --lavender: #cdc1f0;
    --lavender-soft: #ece6fb;
    --peach: #ffd6b8;
    --peach-soft: #fff0e3;
    --sky: #b8d9f5;
    --sky-soft: #e3f0fb;
    --lemon: #fdeeaa;
    --lemon-soft: #fdf8df;
    --shadow: 0 8px 28px rgba(200, 160, 195, 0.18);
    --shadow-soft: 0 4px 14px rgba(200, 160, 195, 0.12);
    --radius: 16px;
    --radius-sm: 10px;
    --hour-h: 50px;
  }

  body {
    font-family: 'Quicksand', 'Zen Maru Gothic', sans-serif;
    background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg) 45%, var(--bg-grad-2) 100%);
    background-attachment: fixed;
    color: var(--text);
    height: 100vh;
    padding: 16px;
    overflow: hidden;
    display: flex;
    justify-content: center;
  }

  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(50px);
    opacity: 0.5;
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 340px; height: 340px;
    background: radial-gradient(circle, #ffd6ec, transparent 70%);
    top: -90px; left: -60px;
  }
  body::after {
    width: 380px; height: 380px;
    background: radial-gradient(circle, #d4e7fb, transparent 70%);
    bottom: -120px; right: -80px;
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1180px;
    height: 100%;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(16px);
    border: 1.5px solid rgba(255, 255, 255, 0.8);
    border-radius: 22px;
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── TOP BAR ── */
  .topbar {
    padding: 14px 24px 12px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .nav-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .icon-btn {
    width: 36px; height: 36px;
    border: none;
    border-radius: 50%;
    background: var(--surface);
    color: var(--text-soft);
    font-size: 17px;
    cursor: pointer;
    display: grid;
    place-items: center;
    box-shadow: var(--shadow-soft);
    transition: transform .18s, color .18s;
  }
  .icon-btn:hover { transform: scale(1.12); color: var(--pink); }
  .icon-btn:active { transform: scale(0.95); }

  .period-label {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    font-size: 18px;
    min-width: 156px;
    text-align: center;
    color: var(--text);
  }

  .today-btn {
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text-soft);
    padding: 8px 16px;
    border-radius: 50px;
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    box-shadow: var(--shadow-soft);
    transition: transform .18s, color .18s;
  }
  .today-btn:hover { transform: translateY(-2px); color: var(--pink); }

  .spacer { flex: 1; }

  /* ── VIEW TOGGLE ── */
  .view-toggle {
    display: flex;
    background: var(--surface);
    border-radius: 50px;
    padding: 4px;
    box-shadow: var(--shadow-soft);
  }
  .view-toggle button {
    border: none;
    background: none;
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    color: var(--text-soft);
    padding: 8px 18px;
    border-radius: 50px;
    cursor: pointer;
    transition: color .2s;
  }
  .view-toggle button.active {
    color: #fff;
    background: linear-gradient(135deg, var(--pink), var(--lavender));
    box-shadow: 0 4px 10px rgba(205, 193, 240, 0.55);
  }

  /* ── BODY ── */
  .view {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 4px 16px 14px;
    overflow: hidden;
  }
  .hidden { display: none !important; }

  /* ── MONTH VIEW ── */
  .weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 6px;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .weekday-row span {
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .05em;
    color: var(--text-soft);
    padding: 4px 0;
  }
  .weekday-row span.sun { color: #f3a0bd; }
  .weekday-row span.sat { color: #a0bff3; }

  .month-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(6, 1fr);
    flex: 1;
    gap: 6px;
    overflow: hidden;
  }
  .day-cell {
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 6px 6px 4px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform .16s, box-shadow .16s, border-color .16s;
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow: hidden;
  }
  .day-cell:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-soft);
    border-color: var(--pink-soft);
  }
  .day-cell.other-month { background: var(--surface-soft); opacity: .55; }
  .day-cell.today { border-color: var(--pink); background: var(--pink-soft); }
  .day-num {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    width: 24px; height: 24px;
    display: grid; place-items: center;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .day-cell.today .day-num {
    background: linear-gradient(135deg, var(--pink), var(--lavender));
    color: #fff;
  }
  .day-cell.sun .day-num { color: #f3a0bd; }
  .day-cell.sat .day-num { color: #7da8e0; }
  .day-cell.today.sun .day-num, .day-cell.today.sat .day-num { color: #fff; }

  /* Google Calendar-like event chip */
  .chip {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 7px;
    border-radius: 5px;
    overflow: hidden;
    line-height: 1.45;
    cursor: pointer;
    user-select: none;
    flex-shrink: 0;
    transition: filter .12s, box-shadow .12s;
  }
  .chip:hover { filter: brightness(0.92); }
  .chip.selected {
    box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(0, 0, 0, 0.28);
  }
  .chip-time {
    font-size: 11px;
    font-weight: 500;
    flex-shrink: 0;
    opacity: 0.9;
    white-space: nowrap;
  }
  .chip-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .more-chip {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-soft);
    padding: 1px 4px;
    flex-shrink: 0;
  }

  /* ── WEEK / TIMELINE VIEW ── */
  .week-head {
    display: grid;
    grid-template-columns: 56px repeat(7, 1fr);
    gap: 0;
    border-bottom: 2px solid var(--border-soft);
    margin-bottom: 2px;
    flex-shrink: 0;
  }
  .week-head .corner {}
  .week-head .wh-cell {
    text-align: center;
    padding: 6px 2px 10px;
  }
  .week-head .wh-dow {
    font-size: 11px; font-weight: 700; color: var(--text-soft);
  }
  .week-head .wh-dow.sun { color: #f3a0bd; }
  .week-head .wh-dow.sat { color: #7da8e0; }
  .week-head .wh-num {
    font-size: 17px; font-weight: 700; color: var(--text);
    width: 34px; height: 34px; margin: 3px auto 0;
    display: grid; place-items: center; border-radius: 50%;
  }
  .week-head .wh-cell.today .wh-num {
    background: linear-gradient(135deg, var(--pink), var(--lavender));
    color: #fff;
  }

  .timeline-scroll {
    flex: 1;
    overflow-y: auto;
    border-radius: var(--radius-sm);
  }
  .timeline-scroll::-webkit-scrollbar { width: 9px; }
  .timeline-scroll::-webkit-scrollbar-thumb {
    background: var(--pink-soft); border-radius: 10px;
  }
  .timeline-scroll::-webkit-scrollbar-track { background: transparent; }

  .timeline {
    display: grid;
    grid-template-columns: 56px repeat(7, 1fr);
    position: relative;
  }
  .hour-label {
    height: var(--hour-h);
    text-align: right;
    padding-right: 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-faint);
    transform: translateY(-7px);
  }
  .day-col {
    position: relative;
    border-left: 1.5px solid var(--border-soft);
  }
  .hour-line {
    height: var(--hour-h);
    border-bottom: 1.5px solid var(--border-soft);
  }
  .day-col:hover { background: rgba(255, 240, 250, 0.4); }

  .event-block {
    position: absolute;
    left: 3px; right: 3px;
    border-radius: 7px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 600;
    overflow: hidden;
    cursor: pointer;
    user-select: none;
    box-shadow: 0 2px 6px rgba(180,150,180,.18);
    border-left: 3px solid;
    transition: transform .14s, box-shadow .14s;
  }
  .event-block:hover { transform: scale(1.02); z-index: 5; }
  .event-block.selected {
    box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(0, 0, 0, 0.25), 0 2px 8px rgba(180,150,180,.2);
    z-index: 4;
  }
  .event-block .ev-time { font-size: 10px; opacity: .8; font-weight: 600; }
  .event-block .ev-title {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .now-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: #ff7eb3;
    z-index: 6;
  }
  .now-line::before {
    content: ''; position: absolute; left: -4px; top: -3px;
    width: 8px; height: 8px; border-radius: 50%; background: #ff7eb3;
  }

  /* ── FLOATING ADD BUTTON ── */
  .fab {
    position: fixed;
    bottom: 32px; right: 32px;
    width: 56px; height: 56px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--pink), var(--lavender));
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(205,150,200,.5);
    z-index: 30;
    transition: transform .2s;
    display: grid; place-items: center;
  }
  .fab:hover { transform: scale(1.1) rotate(90deg); }
  .fab:active { transform: scale(0.95); }

  /* ── MODAL ── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(120, 90, 115, 0.28);
    backdrop-filter: blur(4px);
    z-index: 40;
    display: grid; place-items: center;
    opacity: 0; pointer-events: none;
    transition: opacity .22s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--surface);
    width: 380px; max-width: 92vw;
    border-radius: 18px;
    padding: 26px 26px 22px;
    box-shadow: var(--shadow);
    transform: translateY(16px) scale(.97);
    transition: transform .26s cubic-bezier(.2,.9,.3,1.3);
  }
  .overlay.show .modal { transform: translateY(0) scale(1); }
  .modal h3 {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 19px; font-weight: 700; margin-bottom: 18px;
    display: flex; align-items: center; gap: 8px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 12px; font-weight: 700;
    color: var(--text-soft); margin-bottom: 6px; padding-left: 4px;
  }
  .field input, .field select {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    font-family: inherit; font-size: 14px; font-weight: 500;
    color: var(--text);
    background: var(--surface-soft);
    outline: none;
    transition: border-color .18s, box-shadow .18s;
  }
  .field input:focus, .field select:focus {
    border-color: var(--pink);
    box-shadow: 0 0 0 4px var(--pink-soft);
  }
  .time-row { display: flex; gap: 10px; }
  .time-row .field { flex: 1; margin-bottom: 0; }

  .color-row { display: flex; gap: 10px; padding-left: 4px; }
  .color-dot {
    width: 30px; height: 30px; border-radius: 50%;
    cursor: pointer; border: 3px solid transparent;
    transition: transform .15s;
  }
  .color-dot:hover { transform: scale(1.18); }
  .color-dot.sel { border-color: var(--text-soft); transform: scale(1.12); }

  .modal-actions {
    display: flex; gap: 10px; margin-top: 22px;
  }
  .btn {
    flex: 1; border: none; border-radius: 50px;
    padding: 12px; font-family: inherit; font-weight: 700; font-size: 14px;
    cursor: pointer; transition: transform .16s, filter .16s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary {
    background: linear-gradient(135deg, var(--pink), var(--lavender));
    color: #fff;
    box-shadow: 0 6px 14px rgba(205,160,210,.45);
  }
  .btn-ghost { background: var(--surface-soft); color: var(--text-soft); }
  .btn-del {
    background: none; color: #e98aa8; flex: 0 0 auto;
    width: 46px; font-size: 18px; padding: 0;
  }
  .btn-del:hover { background: var(--pink-soft); border-radius: 50px; }

  @media (max-width: 720px) {
    body { padding: 8px; }
    .period-label { min-width: 110px; font-size: 15px; }
    .chip { font-size: 11px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="nav-group">
      <button class="icon-btn" id="prevBtn">‹</button>
      <span class="period-label" id="periodLabel"></span>
      <button class="icon-btn" id="nextBtn">›</button>
    </div>
    <button class="today-btn" id="todayBtn">きょう</button>
    <div class="spacer"></div>
    <div class="view-toggle">
      <button id="monthTab" class="active">月</button>
      <button id="weekTab">週</button>
    </div>
  </div>

  <!-- MONTH VIEW -->
  <div class="view" id="monthView">
    <div class="weekday-row" id="weekdayRow"></div>
    <div class="month-grid" id="monthGrid"></div>
  </div>

  <!-- WEEK / TIMELINE VIEW -->
  <div class="view hidden" id="weekView">
    <div class="week-head" id="weekHead"></div>
    <div class="timeline-scroll" id="timelineScroll">
      <div class="timeline" id="timeline"></div>
    </div>
  </div>
</div>

<button class="fab" id="fab">＋</button>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">✨ あたらしい予定</h3>
    <div class="field">
      <label>タイトル</label>
      <input type="text" id="fTitle" placeholder="なにをする？" autocomplete="off">
    </div>
    <div class="field">
      <label>日付</label>
      <input type="date" id="fDate">
    </div>
    <div class="time-row">
      <div class="field">
        <label>開始</label>
        <input type="time" id="fStart" value="09:00">
      </div>
      <div class="field">
        <label>終了</label>
        <input type="time" id="fEnd" value="10:00">
      </div>
    </div>
    <div class="field">
      <label>いろ</label>
      <div class="color-row" id="colorRow"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-del hidden" id="delBtn">🗑</button>
      <button class="btn btn-ghost" id="cancelBtn">やめる</button>
      <button class="btn btn-primary" id="saveBtn">ほぞん</button>
    </div>
  </div>
</div>

<script>
  // ── data ──
  const COLORS = [
    { key:'pink',     bg:'var(--pink-soft)',     bar:'#ff9ec7', text:'#b8527e', chipText:'#fff' },
    { key:'mint',     bg:'var(--mint-soft)',     bar:'#74d6b0', text:'#3f8b6e', chipText:'#fff' },
    { key:'lavender', bg:'var(--lavender-soft)', bar:'#a99af0', text:'#6a5aa8', chipText:'#fff' },
    { key:'peach',    bg:'var(--peach-soft)',    bar:'#ffb27a', text:'#c47636', chipText:'#fff' },
    { key:'sky',      bg:'var(--sky-soft)',      bar:'#7db8ee', text:'#3f74a8', chipText:'#fff' },
    { key:'lemon',    bg:'var(--lemon-soft)',    bar:'#f5d96b', text:'#a8893a', chipText:'#7a5e20' },
  ];
  const colorOf = k => COLORS.find(c => c.key === k) || COLORS[0];
  const WEEKDAYS = ['日','月','火','水','木','金','土'];

  const STORE = 'purun-calendar-events';
  let events = load();
  function load(){ try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch(e){ return []; } }
  function save(){ localStorage.setItem(STORE, JSON.stringify(events)); }

  // ── seed sample events on first run ──
  if (events.length === 0) {
    const t = new Date();
    const iso = d => d.toISOString().slice(0,10);
    const mk = (off,s,e,title,color) => {
      const d = new Date(t); d.setDate(t.getDate()+off);
      return { id: crypto.randomUUID(), date: iso(d), start:s, end:e, title, color };
    };
    events = [
      mk(0,'10:00','11:00','朝のおさんぽ☕','mint'),
      mk(0,'14:00','15:30','デザインMTG','lavender'),
      mk(1,'09:30','10:30','ヨガレッスン','pink'),
      mk(2,'13:00','14:00','ランチ会🍰','peach'),
      mk(3,'16:00','18:00','映画みる🎬','sky'),
      mk(-1,'19:00','20:00','よみかけの本','lemon'),
    ];
    save();
  }

  // ── state ──
  let view = 'month';
  let cursor = new Date();
  let editingId = null;
  let pickedColor = 'pink';
  let selectedId = null;

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,'0');
  const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };

  // ── selection ──
  function selectEvent(id) {
    selectedId = id;
    document.querySelectorAll('.chip[data-id], .event-block[data-id]').forEach(el => {
      el.classList.toggle('selected', el.dataset.id === id);
    });
  }

  // ── render: month ──
  function renderWeekdayRow(){
    $('weekdayRow').innerHTML = WEEKDAYS.map((d,i)=>
      `<span class="${i===0?'sun':i===6?'sat':''}">${d}</span>`).join('');
  }

  function renderMonth(){
    const y = cursor.getFullYear(), m = cursor.getMonth();
    $('periodLabel').textContent = `${y}年 ${m+1}月`;
    const first = new Date(y, m, 1);
    const start = new Date(first);
    start.setDate(1 - first.getDay());
    const today = new Date();
    let html = '';
    for (let i=0; i<42; i++){
      const d = new Date(start); d.setDate(start.getDate()+i);
      const dow = d.getDay();
      const other = d.getMonth() !== m;
      const isToday = sameDay(d, today);
      const dayEvents = events
        .filter(e => e.date === isoDate(d))
        .sort((a,b)=> toMin(a.start)-toMin(b.start));
      let chips = dayEvents.slice(0,3).map(e=>{
        const c = colorOf(e.color);
        return `<div class="chip" data-id="${e.id}" style="background:${c.bar};color:${c.chipText}">
          <span class="chip-time">${e.start}</span>
          <span class="chip-title">${escapeHtml(e.title)}</span>
        </div>`;
      }).join('');
      if (dayEvents.length>3) chips += `<div class="more-chip">+${dayEvents.length-3}件</div>`;
      html += `<div class="day-cell ${other?'other-month':''} ${isToday?'today':''} ${dow===0?'sun':dow===6?'sat':''}" data-date="${isoDate(d)}">
        <div class="day-num">${d.getDate()}</div>${chips}
      </div>`;
    }
    $('monthGrid').innerHTML = html;

    // chip: single click → select, double click → edit
    $('monthGrid').querySelectorAll('.chip[data-id]').forEach(chip => {
      chip.addEventListener('click', e => {
        e.stopPropagation();
        selectEvent(chip.dataset.id);
      });
      chip.addEventListener('dblclick', e => {
        e.stopPropagation();
        openModal(chip.dataset.id);
      });
    });

    // day cell: click on empty area → deselect + new event
    $('monthGrid').querySelectorAll('.day-cell').forEach(cell => {
      cell.addEventListener('click', () => {
        selectEvent(null);
        openModal(null, cell.dataset.date);
      });
    });
  }

  // ── render: week / timeline ──
  function startOfWeek(d){ const s=new Date(d); s.setDate(d.getDate()-d.getDay()); s.setHours(0,0,0,0); return s; }

  function renderWeek(){
    const sow = startOfWeek(cursor);
    const eow = new Date(sow); eow.setDate(sow.getDate()+6);
    const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
    $('periodLabel').textContent = `${fmt(sow)} – ${fmt(eow)}`;

    const today = new Date();
    let head = `<div class="corner"></div>`;
    for (let i=0;i<7;i++){
      const d = new Date(sow); d.setDate(sow.getDate()+i);
      const isToday = sameDay(d, today);
      head += `<div class="wh-cell ${isToday?'today':''}">
        <div class="wh-dow ${i===0?'sun':i===6?'sat':''}">${WEEKDAYS[i]}</div>
        <div class="wh-num">${d.getDate()}</div>
      </div>`;
    }
    $('weekHead').innerHTML = head;

    let tl = '';
    tl += `<div>`;
    for (let h=0; h<24; h++){
      tl += `<div class="hour-label">${h===0?'':pad(h)+':00'}</div>`;
    }
    tl += `</div>`;
    for (let i=0;i<7;i++){
      const d = new Date(sow); d.setDate(sow.getDate()+i);
      const dateStr = isoDate(d);
      let col = `<div class="day-col" data-date="${dateStr}">`;
      for (let h=0; h<24; h++) col += `<div class="hour-line"></div>`;
      events.filter(e=>e.date===dateStr).forEach(e=>{
        const s = toMin(e.start), en = toMin(e.end);
        const top = s/60*50, height = Math.max((en-s)/60*50, 22);
        const c = colorOf(e.color);
        col += `<div class="event-block" data-id="${e.id}"
          style="top:${top}px;height:${height-3}px;background:${c.bg};border-left-color:${c.bar};color:${c.text}">
          <div class="ev-time">${e.start}</div>
          <div class="ev-title">${escapeHtml(e.title)}</div>
        </div>`;
      });
      if (sameDay(d, today)){
        const nowTop = (today.getHours()*60+today.getMinutes())/60*50;
        col += `<div class="now-line" style="top:${nowTop}px"></div>`;
      }
      col += `</div>`;
      tl += col;
    }
    $('timeline').innerHTML = tl;

    // event-block: single click → select, double click → edit
    $('timeline').querySelectorAll('.event-block').forEach(b => {
      b.addEventListener('click', ev => {
        ev.stopPropagation();
        selectEvent(b.dataset.id);
      });
      b.addEventListener('dblclick', ev => {
        ev.stopPropagation();
        openModal(b.dataset.id);
      });
    });
    $('timeline').querySelectorAll('.day-col').forEach(col => {
      col.addEventListener('click', ev => {
        if (ev.target.closest('.event-block')) return;
        selectEvent(null);
        const rect = col.getBoundingClientRect();
        const offY = ev.clientY - rect.top;
        const hour = Math.max(0, Math.min(23, Math.floor(offY/50)));
        openModal(null, col.dataset.date, pad(hour)+':00');
      });
    });
  }

  // ── modal ──
  function buildColorRow(){
    $('colorRow').innerHTML = COLORS.map(c=>
      `<div class="color-dot" data-color="${c.key}" style="background:${c.bar}"></div>`).join('');
    $('colorRow').querySelectorAll('.color-dot').forEach(dot=>{
      dot.addEventListener('click', ()=>{
        pickedColor = dot.dataset.color;
        $('colorRow').querySelectorAll('.color-dot').forEach(d=>d.classList.remove('sel'));
        dot.classList.add('sel');
      });
    });
  }
  function selectColor(key){
    pickedColor = key;
    $('colorRow').querySelectorAll('.color-dot').forEach(d=>
      d.classList.toggle('sel', d.dataset.color===key));
  }

  function openModal(id, date, startTime){
    editingId = id;
    if (id){
      const e = events.find(x=>x.id===id);
      $('modalTitle').textContent = '✏️ 予定をへんしゅう';
      $('fTitle').value = e.title;
      $('fDate').value = e.date;
      $('fStart').value = e.start;
      $('fEnd').value = e.end;
      selectColor(e.color);
      $('delBtn').classList.remove('hidden');
    } else {
      $('modalTitle').textContent = '✨ あたらしい予定';
      $('fTitle').value = '';
      $('fDate').value = date || isoDate(cursor);
      $('fStart').value = startTime || '09:00';
      const eh = startTime ? pad(Math.min(23, parseInt(startTime)+1))+':00' : '10:00';
      $('fEnd').value = eh;
      selectColor('pink');
      $('delBtn').classList.add('hidden');
    }
    $('overlay').classList.add('show');
    setTimeout(()=>$('fTitle').focus(), 120);
  }
  function closeModal(){ $('overlay').classList.remove('show'); editingId=null; }

  function saveEvent(){
    const title = $('fTitle').value.trim() || 'むだい';
    const date = $('fDate').value;
    let start = $('fStart').value, end = $('fEnd').value;
    if (!date) { $('fDate').focus(); return; }
    if (toMin(end) <= toMin(start)) end = pad(Math.min(23, parseInt(start)+1))+':'+start.slice(3);
    if (editingId){
      const e = events.find(x=>x.id===editingId);
      Object.assign(e, { title, date, start, end, color: pickedColor });
    } else {
      events.push({ id: crypto.randomUUID(), title, date, start, end, color: pickedColor });
    }
    save(); closeModal(); render();
  }
  function deleteEvent(){
    if (!editingId) return;
    events = events.filter(e=>e.id!==editingId);
    save(); closeModal(); render();
  }

  // ── nav ──
  function shift(dir){
    if (view==='month') cursor.setMonth(cursor.getMonth()+dir);
    else cursor.setDate(cursor.getDate()+dir*7);
    render();
  }
  function switchView(v){
    view = v;
    $('monthTab').classList.toggle('active', v==='month');
    $('weekTab').classList.toggle('active', v==='week');
    $('monthView').classList.toggle('hidden', v!=='month');
    $('weekView').classList.toggle('hidden', v!=='week');
    render();
    if (v==='week') $('timelineScroll').scrollTop = 50*7;
  }
  function render(){ view==='month' ? renderMonth() : renderWeek(); }

  function escapeHtml(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // ── event bindings ──
  $('prevBtn').onclick = ()=>shift(-1);
  $('nextBtn').onclick = ()=>shift(1);
  $('todayBtn').onclick = ()=>{ cursor=new Date(); render(); };
  $('monthTab').onclick = ()=>switchView('month');
  $('weekTab').onclick = ()=>switchView('week');
  $('fab').onclick = ()=>openModal(null, isoDate(view==='month'?cursor:new Date()));
  $('cancelBtn').onclick = closeModal;
  $('saveBtn').onclick = saveEvent;
  $('delBtn').onclick = deleteEvent;
  $('overlay').onclick = e=>{ if(e.target===$('overlay')) closeModal(); };
  $('fTitle').addEventListener('keydown', e=>{ if(e.key==='Enter') saveEvent(); });

  // deselect on click outside any event chip/block
  document.addEventListener('click', e => {
    if (!e.target.closest('[data-id]') && !e.target.closest('.overlay')) {
      selectEvent(null);
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); return; }
    // Delete selected event (not when typing in a field)
    if (e.key === 'Delete' && selectedId) {
      if (!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) {
        events = events.filter(ev => ev.id !== selectedId);
        selectedId = null;
        save();
        render();
      }
    }
  });

  // ── init ──
  renderWeekdayRow();
  buildColorRow();
  render();
</script>
</body>
</html>
